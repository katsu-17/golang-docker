services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: password
    ports:
      - 3306:3306
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 30s
  web:
    build:
      context: .
      target: development
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - 8080:8080
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_USER: root
      DB_PASSWORD: password
      DB_PORT: 3306
      DB_HOST: db
